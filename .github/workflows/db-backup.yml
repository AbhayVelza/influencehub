# Daily backup of the live database (NFR-11): pg_dump of Supabase (data and document files), a restore test into a
# throwaway PostgreSQL, then the dump is encrypted and kept as a workflow artifact for 30 days. The repository is
# public, so the dump is never uploaded unencrypted. Restore steps: docs/server.md, "Backups".
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DATABASE_URL  Supabase → Connect → Session pooler connection string
#   BACKUP_PASSPHRASE      Long random passphrase; keep a copy outside GitHub (without it a backup can't be opened)
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      RESTORE_TEST_DATABASE_URL: postgres://postgres:scratch@localhost:5432/postgres
    steps:
      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DATABASE_URL and BACKUP_PASSPHRASE repository secrets."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install PostgreSQL 17 client tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -yq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Back up
        run: node scripts/db-backup.mjs backup --env SUPABASE_DATABASE_URL --out backup

      - name: Restore test
        run: node scripts/db-backup.mjs verify --env RESTORE_TEST_DATABASE_URL --file backup/*.dump

      - name: Encrypt
        run: |
          for f in backup/*.dump; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output "$f.gpg" "$f" <<< "$BACKUP_PASSPHRASE"
            rm "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: influencehub-backup-${{ github.run_id }}
          path: |
            backup/*.dump.gpg
            backup/*.counts.json
          retention-days: 30
          if-no-files-found: error
